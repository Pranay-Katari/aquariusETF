steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.web
      - --build-arg
      - API_URL=${_API_URL}
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}
      - -t
      - ${_IMAGE}
      - .
images: ["${_IMAGE}"]
substitutions:
  _IMAGE: ""
  _API_URL: ""
  _SUPABASE_URL: ""
  _SUPABASE_ANON_KEY: ""
